[package]
name = "duster"
version = "0.1.0"
edition = "2021"
description = "Duster (拂尘) – installed software manager, uninstaller and leftover cleaner for Windows 10/11"
license = "MIT"
rust-version = "1.85"

[lib]
name = "duster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.23"
png = "0.18"
trash = "5"
dirs = "7"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_ApplicationInstallationAndServicing",
] }

[features]
# Produces a build that stores settings/logs/backups next to the executable.
portable = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
