<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Duster 拂尘 · 应用图标矢量母版
    等轴六边形包裹轮廓 + 居中减号。配色与应用内标题栏标识的 from-accent to-brand2 同一套。
    光栅化：Edge headless --window-size=1024,1024 --screenshot=…  → source-1024.png
    再 bun run icons 生成全套尺寸 + icon.ico。
    改设计只改这个文件，详见 AGENTS.md §5.1。
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005fb8"/>
      <stop offset="55%" stop-color="#2a63c8"/>
      <stop offset="100%" stop-color="#6b46d6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#gloss)"/>
  <path d="M512 214 L818 376 L818 648 L512 810 L206 648 L206 376 Z"
        fill="none" stroke="#ffffff" stroke-width="72" stroke-linejoin="round"/>
  <rect x="352" y="473" width="320" height="78" rx="39" fill="#ffffff"/>
</svg>
