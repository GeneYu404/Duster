<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Duster 拂尘 — Windows 已安装软件管理、卸载与残留清理工具（Go + MyGo + React）" />
    <title>Duster 拂尘 · 已安装软件管理与残留清理</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('duster.settings.v1') || '{}');
        var dark = s.theme === 'dark' || ((s.theme === undefined || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
